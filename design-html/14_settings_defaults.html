<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>NIKO NEKO — Settings — Defaults</title>
<style>*{box-sizing:border-box;margin:0;padding:0}
body{background:#111;font-family:-apple-system,'SF Pro Display',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:32px}
.phone{width:320px;background:#0a0a0a;border-radius:50px;padding:16px 13px 24px;border:1.5px solid #1a1a1a;flex-shrink:0}
.pill{width:60px;height:5px;background:#1c1c1c;border-radius:3px;margin:0 auto 16px}
.screen{background:#0a0a0a;border-radius:36px;overflow:hidden;display:flex;flex-direction:column;align-items:center;height:660px}
.sets{height:660px;padding:0;flex-direction:column}
.nb{display:flex;align-items:center;padding:16px 20px 10px;flex-shrink:0;width:100%}
.nbk{font-size:22px;color:#333;margin-right:10px}
.nbt{font-size:16px;color:#3a3a3a;letter-spacing:.04em}
.sbody{flex:1;overflow:hidden;padding:0 18px 14px;display:flex;flex-direction:column}
.slb2{font-size:10px;color:#1a1a1a;letter-spacing:.1em;text-transform:uppercase;padding:10px 2px 5px}
.scard2{background:#111;border-radius:14px;overflow:hidden;margin-bottom:5px}
.srow{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:.5px solid #161616;min-height:50px}
.srow:last-child{border-bottom:none}
.srl{display:flex;align-items:center;gap:10px}
.sico2{font-size:16px;color:#1e1e1e;width:20px;text-align:center}
.snm{font-size:14px;color:#444}
.svl{font-size:13px;color:#1e1e1e}
.schev{font-size:13px;color:#1a1a1a;margin-left:5px}
.tog{width:44px;height:26px;background:#1e1e1e;border-radius:13px;position:relative;flex-shrink:0}
.tog.on{background:#1e3a1e}
.togth{width:20px;height:20px;background:#2a2a2a;border-radius:50%;position:absolute;top:3px;left:3px}
.tog.on .togth{left:21px;background:#6dba6d}
</style>
</head>
<body>
<div class="phone"><div class="pill"></div>
<div class="screen sets">
  <div class="nb"><span class="nbk">‹</span><span class="nbt">Training Defaults</span></div>
  <div class="sbody">
    <div class="slb2">Time</div>
    <div class="scard2">
      <div class="srow"><div class="srl"><span class="sico2">◷</span><span class="snm">Duration</span></div><div style="display:flex;align-items:center;gap:8px">
  <div style="width:26px;height:26px;border-radius:50%;border:.5px solid #1e1e1e;background:#161616;color:#555;font-size:16px;display:flex;align-items:center;justify-content:center">−</div>
  <span style="font-size:16px;font-weight:200;color:#777;min-width:52px;text-align:center">15 min</span>
  <div style="width:26px;height:26px;border-radius:50%;border:.5px solid #1e1e1e;background:#161616;color:#555;font-size:16px;display:flex;align-items:center;justify-content:center">+</div>
</div></div>
      <div class="srow"><div class="srl"><span class="sico2">◎</span><span class="snm">Daily Goal</span></div><div style="display:flex;align-items:center;gap:8px">
  <div style="width:26px;height:26px;border-radius:50%;border:.5px solid #1e1e1e;background:#161616;color:#555;font-size:16px;display:flex;align-items:center;justify-content:center">−</div>
  <span style="font-size:16px;font-weight:200;color:#777;min-width:52px;text-align:center">15 min</span>
  <div style="width:26px;height:26px;border-radius:50%;border:.5px solid #1e1e1e;background:#161616;color:#555;font-size:16px;display:flex;align-items:center;justify-content:center">+</div>
</div></div>
    </div>
    <div class="slb2">Beat</div>
    <div class="scard2">
      <div class="srow"><div class="srl"><span class="sico2">♩</span><span class="snm">BPM</span></div><div style="display:flex;align-items:center;gap:8px">
  <div style="width:26px;height:26px;border-radius:50%;border:.5px solid #1e1e1e;background:#161616;color:#555;font-size:16px;display:flex;align-items:center;justify-content:center">−</div>
  <span style="font-size:16px;font-weight:200;color:#777;min-width:40px;text-align:center">180</span>
  <div style="width:26px;height:26px;border-radius:50%;border:.5px solid #1e1e1e;background:#161616;color:#555;font-size:16px;display:flex;align-items:center;justify-content:center">+</div>
</div></div>
      <div class="srow"><div class="srl"><span class="sico2">♪</span><span class="snm">Sound</span></div>
        <div style="display:flex;background:#191919;border-radius:10px;padding:3px;gap:2px">
          <span style="padding:5px 10px;border-radius:8px;background:#1c1c1c;color:#888;font-size:13px">叩</span>
          <span style="padding:5px 10px;font-size:13px;color:#222">鈴</span>
          <span style="padding:5px 10px;font-size:13px;color:#222">鼓</span>
          <span style="padding:5px 10px;font-size:13px;color:#222">木</span>
        </div>
      </div>
      <div class="srow"><div class="srl"><span class="sico2">♫</span><span class="snm">Lock Volume</span></div><div class="tog"><div class="togth"></div></div></div>
    </div>
  </div>
</div></div>

</body>
</html>
