<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>NIKO NEKO — Watch — Idle</title>
<style>*{box-sizing:border-box;margin:0;padding:0}
body{background:#111;font-family:-apple-system,'SF Pro Display',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:32px}
.watch{width:200px;background:#0a0a0a;border-radius:46px;padding:14px 12px 20px;border:1.5px solid #1a1a1a;position:relative}
.watch::after{content:'';position:absolute;right:-5px;top:28%;width:5px;height:42px;background:#1a1a1a;border-radius:0 4px 4px 0}
.watch::before{content:'';position:absolute;right:-5px;top:50%;width:5px;height:22px;background:#1a1a1a;border-radius:0 3px 3px 0}
.wpill{width:32px;height:4px;background:#1c1c1c;border-radius:2px;margin:0 auto 12px}
.wscr{background:#0a0a0a;border-radius:26px;height:220px;display:flex;flex-direction:column;align-items:center;padding:18px 16px;justify-content:space-between}
.wtime{font-size:54px;font-weight:200;color:#f0ede8;letter-spacing:-2.5px;line-height:1;text-align:center}
.wm{font-size:13px;color:#282828}
.wbtn{width:50px;height:50px;border-radius:50%;border:1px solid #1c1c1c;display:flex;align-items:center;justify-content:center;font-size:18px;color:#2a2a2a}
.wanim{height:26px;display:flex;align-items:center;justify-content:center;opacity:.65}
</style>
</head>
<body>
<div class="watch"><div class="wpill"></div>
<div class="wscr">
  <div class="wanim" id="wcat"></div>
  <div class="wtime">15</div>
  <div style="font-size:11px;color:#1e1e1e;letter-spacing:.05em">min · ♩ 180 bpm</div>
  <div class="wbtn">▶</div>
</div></div>
<script>let f=false;const c=document.getElementById('wcat');
setInterval(()=>{f=!f;c.innerHTML=`<svg width="44" height="24" viewBox="0 0 40 22" fill="#888"><ellipse cx="12" cy="12" rx="9" ry="5.5"/><circle cx="28" cy="7" r="5.5"/><polygon points="23,2 25.5,-3 29,2"/><line x1="5" y1="16" x2="1.7999999999999998" y2="21" stroke="#888" stroke-width="2" stroke-linecap="round" fill="none"/><line x1="12" y1="16" x2="15.04" y2="21" stroke="#888" stroke-width="2" stroke-linecap="round" fill="none"/><line x1="18" y1="16" x2="21.36" y2="21" stroke="#888" stroke-width="2" stroke-linecap="round" fill="none"/><line x1="25" y1="16" x2="21.96" y2="21" stroke="#888" stroke-width="2" stroke-linecap="round" fill="none"/></svg>`;},190);
c.innerHTML=`<svg width="44" height="24" viewBox="0 0 40 22" fill="#888"><ellipse cx="12" cy="12" rx="9" ry="5.5"/><circle cx="28" cy="7" r="5.5"/><polygon points="23,2 25.5,-3 29,2"/><line x1="5" y1="16" x2="1.7999999999999998" y2="21" stroke="#888" stroke-width="2" stroke-linecap="round" fill="none"/><line x1="12" y1="16" x2="15.04" y2="21" stroke="#888" stroke-width="2" stroke-linecap="round" fill="none"/><line x1="18" y1="16" x2="21.36" y2="21" stroke="#888" stroke-width="2" stroke-linecap="round" fill="none"/><line x1="25" y1="16" x2="21.96" y2="21" stroke="#888" stroke-width="2" stroke-linecap="round" fill="none"/></svg>`;</script>
</body>
</html>
