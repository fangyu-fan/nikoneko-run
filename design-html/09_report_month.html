<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>NIKO NEKO — Report — Month</title>
<style>*{box-sizing:border-box;margin:0;padding:0}
body{background:#111;font-family:-apple-system,'SF Pro Display',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:32px}
.phone{width:320px;background:#0a0a0a;border-radius:50px;padding:16px 13px 24px;border:1.5px solid #1a1a1a;flex-shrink:0}
.pill{width:60px;height:5px;background:#1c1c1c;border-radius:3px;margin:0 auto 16px}
.screen{background:#0a0a0a;border-radius:36px;overflow:hidden;display:flex;flex-direction:column;align-items:center;height:660px}
.rs{height:660px;flex-direction:column;padding:0}
.ptabs{display:flex;border-bottom:.5px solid #141414;flex-shrink:0;width:100%}
.ptab{flex:1;padding:11px 0;font-size:13px;color:#1e1e1e;text-align:center;border-bottom:2px solid transparent}
.ptab.act{color:#888;border-bottom-color:#444}
.rb{flex:1;overflow:hidden;padding:10px 18px 12px;display:flex;flex-direction:column;gap:8px}
.drow{display:flex;justify-content:space-between;align-items:center}
.dnav{font-size:20px;color:#1e1e1e}
.dstr{font-size:13px;color:#2a2a2a}
.hnum{font-size:54px;font-weight:200;color:#f0ede8;letter-spacing:-2.5px;line-height:1}
.hunit{font-size:15px;color:#2a2a2a}
.hlbl{font-size:10px;color:#181818;letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.cg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}
.sc{background:#111;border-radius:10px;padding:10px 11px;border:.5px solid transparent}
.sc.act{border-color:#1e3a1e;background:#0e1a0e}
.sico{font-size:12px;color:#1e1e1e;margin-bottom:3px}
.snum{font-size:18px;font-weight:200;color:#555;letter-spacing:-.5px;line-height:1}
.snum.hi{color:#4a8c4a}
.slb{font-size:8px;color:#161616;margin-top:2px}
.bars{display:flex;align-items:flex-end;gap:3px;height:72px}
.bar{flex:1;border-radius:2px 2px 0 0;background:#1a2e1a;min-height:2px}
.bar.m{background:#2e5c2e}.bar.h{background:#4a8c4a}
.bxrow{display:flex;gap:3px}
.bx{flex:1;font-size:8px;color:#181818;text-align:center}
.log-item{display:flex;align-items:center;padding:7px 0;border-bottom:.5px solid #0f0f0f;gap:8px}
.ldot{width:6px;height:6px;border-radius:1.5px;flex-shrink:0;background:#2e5c2e}
.ldot.lo{background:#1e3a1e}
.ldate{font-size:13px;color:#2e2e2e;min-width:40px;flex-shrink:0}
.lmain{font-size:14px;color:#404040;flex:1}
.lsub{font-size:11px;color:#222;margin-top:1px}
.lchev{font-size:12px;color:#181818}
</style>
</head>
<body>
<div class="phone"><div class="pill"></div>
<div class="screen rs">
  <div class="ptabs"><div class="ptab">Day</div><div class="ptab">Week</div><div class="ptab act">Month</div><div class="ptab">Year</div></div>
  <div class="rb">
    <div class="drow"><span class="dnav">‹</span><span class="dstr">2026/05</span><span class="dnav">›</span></div>
    <div><div style="display:flex;align-items:baseline;gap:6px"><span class="hnum">26.5</span><span class="hunit">hrs</span></div><div class="hlbl">Duration</div></div>
    <div class="cg3">
      <div class="sc act"><div class="sico">⊙</div><div class="snum hi">72.3</div><div class="slb">Distance</div></div>
      <div class="sc"><div class="sico">△</div><div class="snum">4.8k</div><div class="slb">Calories</div></div>
      <div class="sc"><div class="sico">⊞</div><div class="snum">123k</div><div class="slb">Steps</div></div>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end">
      <div class="bars"><div class="bar m" style="height:50%"></div><div class="bar " style="height:2%"></div><div class="bar m" style="height:72%"></div><div class="bar " style="height:33%"></div><div class="bar h" style="height:89%"></div><div class="bar m" style="height:56%"></div><div class="bar " style="height:2%"></div><div class="bar h" style="height:78%"></div><div class="bar m" style="height:50%"></div><div class="bar h" style="height:94%"></div><div class="bar m" style="height:67%"></div><div class="bar " style="height:2%"></div><div class="bar h" style="height:83%"></div><div class="bar m" style="height:44%"></div><div class="bar h" style="height:100%"></div><div class="bar m" style="height:61%"></div><div class="bar " style="height:2%"></div><div class="bar m" style="height:72%"></div><div class="bar " style="height:33%"></div><div class="bar h" style="height:89%"></div><div class="bar m" style="height:56%"></div><div class="bar " style="height:2%"></div><div class="bar h" style="height:78%"></div><div class="bar m" style="height:50%"></div><div class="bar h" style="height:94%"></div><div class="bar m" style="height:67%"></div><div class="bar " style="height:2%"></div><div class="bar h" style="height:83%"></div><div class="bar m" style="height:44%"></div><div class="bar " style="height:23%"></div></div>
      <div class="bxrow"><div class="bx">1</div><div class="bx"></div><div class="bx"></div><div class="bx"></div><div class="bx"></div><div class="bx"></div><div class="bx">7</div><div class="bx"></div><div class="bx"></div><div class="bx"></div><div class="bx"></div><div class="bx"></div><div class="bx">13</div><div class="bx"></div><div class="bx"></div><div class="bx"></div><div class="bx"></div><div class="bx"></div><div class="bx">19</div><div class="bx"></div><div class="bx"></div><div class="bx"></div><div class="bx"></div><div class="bx"></div><div class="bx">25</div><div class="bx"></div><div class="bx"></div><div class="bx"></div><div class="bx"></div><div class="bx"></div></div>
    </div>
    <div class="log-item"><div class="ldot"></div><span class="ldate">Today</span><div style="flex:1"><div class="lmain">21 min</div><div class="lsub">72.3 km total</div></div><span class="lchev">›</span></div>
    <div class="log-item"><div class="ldot"></div><span class="ldate">5/17</span><div style="flex:1"><div class="lmain">25 min</div><div class="lsub">2.5 km</div></div><span class="lchev">›</span></div>
    <div class="log-item" style="border:none"><div class="ldot lo"></div><span class="ldate">5/16</span><div style="flex:1"><div class="lmain">30 min</div><div class="lsub">3.0 km</div></div><span class="lchev">›</span></div>
  </div>
</div></div>

</body>
</html>
